name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Version, graph, and check
        run: |
          set -euo pipefail
          ./bin/tetherwise version | grep -q tetherwise
          set +e
          graph_out=$(./bin/tetherwise graph 2>&1)
          graph_code=$?
          check_out=$(./bin/tetherwise check 2>&1)
          check_code=$?
          set -e
          test "$graph_code" -ne 0
          test "$check_code" -ne 0
          printf '%s\n' "$graph_out" | grep -q "not implemented yet"
          printf '%s\n' "$check_out" | grep -q "not implemented yet"

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: ./...
          skip-cache: true

      - name: gofmt
        run: |
          set -euo pipefail
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt would change:"
            printf '%s\n' "$out"
            exit 1
          fi

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - name: govulncheck
        run: make vuln
