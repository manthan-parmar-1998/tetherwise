name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Version and offline demo
        run: |
          set -euo pipefail
          ./bin/tetherwise version | grep -q tetherwise
          ./bin/tetherwise graph \
            --tf-plan lab/scenarios/opensearch-shared-overload/plan.json \
            --k8s lab/scenarios/opensearch-shared-overload/k8s \
            --edges lab/scenarios/opensearch-shared-overload/tetherwise.edges.yaml \
            -o /tmp/tetherwise-snapshot.json
          set +e
          ./bin/tetherwise check lab/scenarios/opensearch-shared-overload/plan.json \
            --snapshot /tmp/tetherwise-snapshot.json \
            --metrics fixture:lab/scenarios/opensearch-shared-overload/metrics.json \
            --format markdown \
            --fail-on high >/tmp/tetherwise-comment.md
          code=$?
          set -e
          test "$code" -eq 2
          grep -q "high-exposure" /tmp/tetherwise-comment.md
          grep -q "keel/keel-query" /tmp/tetherwise-comment.md

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: ./...
          skip-cache: true

      - name: gofmt
        run: |
          set -euo pipefail
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt would change:"
            printf '%s\n' "$out"
            exit 1
          fi

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - name: govulncheck
        run: make vuln
