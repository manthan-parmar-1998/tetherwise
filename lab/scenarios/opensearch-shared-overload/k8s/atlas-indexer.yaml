apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit
  namespace: atlas
  labels:
    team: Atlas
    owner: atlas-oncall
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        1
    [OUTPUT]
        Name         es
        Match        *
        Host         search-lab.us-east-1.es.amazonaws.com
        Port         443
        TLS          On
        Index        logs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-indexer
  namespace: atlas
  labels:
    app: atlas-indexer
    team: Atlas
    owner: atlas-oncall
spec:
  replicas: 2
  selector:
    matchLabels:
      app: atlas-indexer
  template:
    metadata:
      labels:
        app: atlas-indexer
        team: Atlas
    spec:
      containers:
        - name: indexer
          image: example.local/atlas-indexer:1.0.0
          env:
            - name: OPENSEARCH_ENDPOINT
              value: search-lab.us-east-1.es.amazonaws.com
        - name: fluent-bit
          image: example.local/fluent-bit:3.0.0
          volumeMounts:
            - name: fluent-bit
              mountPath: /fluent-bit/etc
      volumes:
        - name: fluent-bit
          configMap:
            name: fluent-bit
