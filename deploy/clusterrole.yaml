apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tetherwise-readonly
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - configmaps
      - namespaces
      - endpoints
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["get", "list", "watch"]
  # A SelfSubjectAccessReview is how the process asks whether it can mutate.
  # The API server accepts that question as a create. It does not create a workload.
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectaccessreviews"]
    verbs: ["create"]
